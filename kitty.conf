# Font
font_family CaskaydiaCove Nerd Font Mono
font_size 14.0

# cyberdream theme for kitty
background            #000000
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #16181a
selection_background  #3c4048
color0                #16181a
color8                #3c4048
color1                #ff6e5e
color9                #ff6e5e
color2                #5eff6c
color10               #5eff6c
color3                #f1ff5e
color11               #f1ff5e
color4                #5ea1ff
color12               #5ea1ff
color5                #bd5eff
color13               #bd5eff
color6                #5ef1ff
color14               #5ef1ff
color7                #ffffff
color15               #ffffff
selection_foreground  #ffffff
active_tab_foreground #000000
active_tab_background #ffbd5e
inactive_tab_foreground #ffffff
inactive_tab_background #16181a

# Tab bar
tab_bar_style powerline
active_tab_foreground   #ffffff
active_tab_background   #5ea1ff
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #000000
inactive_tab_font_style bold
tab_bar_background #000000

# Title bar
macos_titlebar_color #000000

# New tab opens in the same directory as the current tab
map cmd+t new_tab_with_cwd
map ctrl+shift+t new_tab_with_cwd

# Jump to tab by index with cmd+<number>
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
